services:
  - type: worker
    name: msliderbot
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: DB_PATH
        value: /var/data/bot.db
    disk:
      name: botdata
      mountPath: /var/data
      sizeGB: 1
